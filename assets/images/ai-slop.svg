<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI Slop title image</title>
  <desc id="desc">A stylized forum thread dissolving into synthetic noise, with a human editorial signal cutting through it.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10151f"/>
      <stop offset="0.48" stop-color="#263225"/>
      <stop offset="1" stop-color="#10151f"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
